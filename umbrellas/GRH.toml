# The umbrella GRH, for `tauceti work --roadmap-only GRH`: the roadmap areas that the roadmaps
# under TauCetiRoadmap/RiemannHypothesisForDirichletLFunctions/ need.
#
# Generated by .github/scripts/gen_umbrella.py from the roadmaps' READMEs; do not edit it by hand.
# Only `description`, `goal` and `root` are written by hand: the generator reads them and keeps
# them as they are. It is regenerated once a day, and at once when the umbrella's own files or the
# generator change.
#
# A member is an area, a top-level directory of TauCetiRoadmap/, that contains a unit the goal
# needs. The goal needs every section of the roadmaps under
# TauCetiRoadmap/RiemannHypothesisForDirichletLFunctions/ and, transitively, what a needed section
# needs: what its *Needs:* or *Prerequisites:* lines name or, when it has none, what the
# Dependencies subsection of its layer cites. A need of a layer that has sections is a need of
# each of its sections; a layer counts as a unit only when it has none, and then needs what the
# *Needs:* lines in it and its own Dependencies subsection name. Roadmaps under Completed/ are
# never members.
#
# `sections` lists the units of a member that the goal needs, in README order, with the roadmap's
# name in front in an area of several roadmaps. The root's area has no `sections`: all of it is in
# scope. `targets` is the target list that orders the work, item by item.

description = "The generalized Riemann hypothesis (GRH), the Riemann hypothesis for Dirichlet L-functions: the family RiemannHypothesisForDirichletLFunctions and the roadmaps it cites. Follow the roadmaps; results may be generalised and proved by other routes, and the formal Lean proof is not to be copied. Only where a roadmap of that family is demonstrably wrong or misses a step, and the formal proof shows what is right, correct it in a form consistent with the formal proof and say so in the pull request."
goal = "the Riemann hypothesis for Dirichlet L-functions, the end theorems of the roadmap family RiemannHypothesisForDirichletLFunctions: for every Dirichlet character χ and every s with Re s > 1/2, L(s, χ) ≠ 0 unless χ is principal and s = 1. For the trivial character this is the Riemann hypothesis for the Riemann zeta function, Mathlib's `RiemannHypothesis`."
root = "RiemannHypothesisForDirichletLFunctions"
targets = "GRH-targets.md"

