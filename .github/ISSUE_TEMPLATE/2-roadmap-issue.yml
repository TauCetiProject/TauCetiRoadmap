name: Roadmap issue (problem with an existing roadmap)
description: Report a problem with a roadmap's content — a wrong or unclear target, a missing prerequisite, a bad dependency, etc.
title: "[Roadmap]: "
labels: ["roadmap-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        For problems with the **content** of an existing roadmap. (To register that you want to
        work on part of a roadmap, use the *Intention* template instead. For problems with how
        the repository itself operates, use the *Meta* template.)
  - type: dropdown
    id: area
    attributes:
      label: Roadmap area
      options:
        - AdicEtaleGeometry
        - AdicSpaces
        - AdicSpacesPartII
        - AdicSpacesPartIII
        - AdicSpacesPartIV
        - AffineLieAlgebras
        - AffineMorseLefschetz
        - AlgebraicCurves
        - AlgebraicTopology
        - AlgebraicVectorBundles
        - AmenableGroups
        - AnalyticToricGeometry
        - BanachAlgebras
        - BanachSpaceTheory
        - BelyiMaps
        - BordismFormalGroups
        - CFSGStatement
        - Chebotarev
        - ClassFieldTheory
        - ClassicalArithmeticCompletion
        - ClassifyingSpaces
        - CombinatorialHeegaardFloer
        - CompactOperators
        - ComplexCurveModuli
        - ComplexKahlerGeometry
        - ComplexTori
        - ConformalMapping
        - DGAInfinity
        - DGFloer
        - DenseGraphLimits
        - DerivedModuleAlgebra
        - DifferentialGeometry
        - DiophantineApproximationAndTranscendence
        - EllipticCurves
        - EnhancedDerivedSheaves
        - EtaleCohomologyFoundations
        - Exchangeability
        - FinancialMathematics
        - FormalLaurentPuiseux
        - FreeProbability
        - FuchsianOrbifolds
        - GeneralizedCohomology
        - GeometricMeasureTheory
        - GeometricRepresentationCategories
        - GeometricTopology
        - GlobalNumberFields
        - GlobalQuadraticForms
        - GraphConnectivityAndFlows
        - GrothendieckEulerForms
        - HamiltonianFloerOperations
        - HeegaardFloer
        - HeightsAndUnits
        - HopfRinow
        - Hyperfunctions
        - InfinitaryLogic
        - IntegralLattices
        - Isoperimetry
        - JacobianChallenge
        - KhovanovHomology
        - LocalFieldsRamification
        - LocalGaloisGroups
        - MassFormula
        - ModularCurves
        - ModularForms
        - MorseNovikov
        - MorseTheory
        - NewtonPolygons
        - NoncommutativeGeometry
        - NumberFieldArithmetic
        - OneParameterSemigroups
        - OperatorAlgebraDynamics
        - OperatorTheory
        - OptimalTransport
        - Orbifolds
        - OrthogonalSpinGroups
        - PDE
        - PadicFunctionalAnalysis
        - PadicMeasuresIwasawaAlgebras
        - PerfectoidSpaces
        - PeripheralActions
        - PivotalSpherical
        - PolynomialGaloisGroups
        - PositiveScalarCurvature
        - ProfiniteArithmetic
        - ProfiniteCohomology
        - ProfiniteProPGroups
        - QuadraticFormInvariants
        - QuantumGroups
        - RealAlgebraicGeometry
        - ReductiveGroups
        - ReflectionInvariantTheory
        - Regularity
        - RepresentationTheory
        - RestrictedPowerSeries
        - RiemannianGeometry
        - RigidAnalyticGeometry
        - SchemeAndStackFoundations
        - SchubertGeometry
        - SpinGeometry
        - StablePeriodicCurved
        - StableReduction
        - StandardDistributions
        - TaubesGromov
        - ThetaSeries
        - Yamabe
        - ZigzagPreprojective
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What's wrong, unclear, missing, or mis-stated? Point to the specific target/item where you can.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: How would you fix it? (Optional.)
    validations:
      required: false
