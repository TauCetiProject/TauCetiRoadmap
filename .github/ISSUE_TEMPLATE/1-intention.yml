name: Intention (claim part of a roadmap)
description: Register that you intend to work on a subset of a roadmap, then claim it on the board so others avoid it.
title: "[Intention]: "
labels: ["intention"]
body:
  - type: markdown
    attributes:
      value: |
        Use this to stake out a slice of a roadmap (one or more targets), so other
        contributors and worker agents don't duplicate it.

        After opening this issue, **comment `claim`** on it to take it on the Tau Ceti board
        (optionally with a duration, e.g. `claim 3 weeks`). It will auto-release when the claim
        expires. Keep the scope as specific as you reasonably can.
  - type: dropdown
    id: area
    attributes:
      label: Roadmap area
      description: Which roadmap does this intention sit in?
      options:
        - AbhyankarLemma
        - AdicEtaleGeometry
        - AdicSpaces
        - AdicSpacesPartII
        - AdicSpacesPartIII
        - AdicSpacesPartIV
        - AffineLieAlgebras
        - AffineMorseLefschetz
        - AlgebraicCurves
        - AlgebraicTopology
        - AlgebraicVectorBundles
        - AmenableGroups
        - AnalyticToricGeometry
        - BanachAlgebras
        - BanachSpaceTheory
        - BelyiMaps
        - BordismFormalGroups
        - BorelEquivalenceRelations
        - CFSGBasicProperties
        - CFSGStatement
        - CharacteristicClasses
        - ClassFieldTheory
        - ClassicalArithmeticCompletion
        - ClassifyingSpaces
        - CombinatorialHeegaardFloer
        - CompactOperators
        - ComplexCurveModuli
        - ComplexKahlerGeometry
        - ComplexManifolds
        - ComplexTori
        - ComputabilityTheory
        - ConformalMapping
        - CountableModelCounting
        - DGAInfinity
        - DGFloer
        - DenseGraphLimits
        - DerivedModuleAlgebra
        - DifferentialGeometry
        - DiophantineApproximationAndTranscendence
        - EllipticCurves
        - EllipticIntegrals
        - EnhancedDerivedSheaves
        - EtaleCohomologyFoundations
        - Exchangeability
        - FinancialMathematics
        - FormalLaurentPuiseux
        - FreeGroupsAndLimitGroups
        - FreeProbability
        - FuchsianOrbifolds
        - GeneralizedCohomology
        - GeometricCurrents
        - GeometricMeasureTheory
        - GeometricRepresentationCategories
        - GeometricTopology
        - GlobalNumberFields
        - GlobalQuadraticForms
        - GraphConnectivityAndFlows
        - GroebnerGeometry
        - GrothendieckEulerForms
        - HamiltonianFloerOperations
        - HeegaardFloer
        - HeightsAndUnits
        - HopfRinow
        - Hyperfunctions
        - ImaginaryQuadraticClassNumber
        - InfinitaryLogic
        - InfinitaryModelExistence
        - IntegralLattices
        - Isoperimetry
        - JacobianChallenge
        - KhovanovHomology
        - LocalFieldsRamification
        - LocalGaloisGroups
        - LocalPurity
        - MarkovChainsAndRenewal
        - MassFormula
        - ModularCurves
        - ModularForms
        - MorseNovikov
        - MorseTheory
        - Neuromanifolds
        - NewtonPolygons
