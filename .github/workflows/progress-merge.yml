name: progress-merge

# Auto-merge generated progress reports (STATUS.md / PROGRESS.md) in this repository.
#
# All the validation, and the merge itself, live in a SHA-pinned reusable workflow in
# TauCetiProgress -- the same discipline TauCeti uses for TauCetiReview, and for the same reason: an
# unpinned `@main` would let an upstream change alter what is allowed to merge here without review.
# The pin is in progress-merge-report.yml, which this workflow calls once per report; it must be
# bumped deliberately, in step with the `progress_ref` input and with the version the worker runs
# (see TauCetiProgress' README).
#
# `pull_request_target` rather than `pull_request` so the App secrets are available for the events we
# care about. That is safe here only because neither this workflow nor the ones it calls ever check
# out or execute pull request content: they read the PR through the API and merge. Note that
# `opened` fires for drafts too, hence the explicit draft guard below as well as inside the called
# workflow.
#
# Anyone may open a pull request against this repository. A pull request that fails any check is
# simply left alone for a human to review, which is the normal path for roadmap contributions.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  # Every twenty minutes: land the progress reports that were held while the merge queue was busy
  # (see "Hold while the merge queue is busy" here and in progress-merge-report.yml).
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to consider.
        required: true
        type: number
      wait_for_queue:
        description: Treat the report as an automatic run does and hold it while the merge queue is busy.
        required: false
        default: false
        type: boolean

# Scheduled runs take turns: a run that outlasts the twenty minutes is not joined by the next, so
# the reports the schedule lets through go one at a time across runs as well as within one. Only
# the schedule shares a group. Every other run is alone in its own, because a shared group keeps
# one waiting run and drops the older one, which pull request events could be used to do to a
# waiting report (see "DELIBERATELY NOT SERIALISED" in the gate). Nobody outside can cause a
# scheduled run, and a dropped scheduled run loses nothing: the next one reads the same reports.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'progress-merge-schedule' || format('progress-merge-{0}', github.run_id) }}
  cancel-in-progress: false

# The floor. `resolve` needs no more than this; the `gate` job raises its own, because a called
# workflow can never exceed what the caller grants.
permissions:
  contents: read
  pull-requests: read


jobs:
  resolve:
    # The script's prefilter, lifted to the job so that an event which cannot concern a report is
    # skipped without taking a runner. Every pull request event starts this workflow, and on
    # 2026-11-07 a few hundred such runs sat in the org's runner queue only to print "not a progress
    # branch". The script and the gate still check everything; this only has to let every real report
    # through. `startsWith` ignores case, so it is looser than the script's `case`, which is the safe
    # direction.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || (github.event_name == 'pull_request_target'
          && !github.event.pull_request.draft
          && startsWith(github.event.pull_request.head.ref, 'progress/'))
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.hold.outputs.prs }}
    steps:
      # Writes `prs`, the pull request numbers to consider, separated by spaces; empty for none.
      - name: Decide which pull requests to consider
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          # Through env, never interpolated into the script: the head ref is attacker-controlled.
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCHED: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request_target)
              # Cheap prefilter, so that only a plausible report ever reaches the gate. The gate
              # re-checks all of this and is the authority; the point here is queueing. The called
              # workflow serialises on a single group, which permits one running and one pending run,
              # so if every pull request in the repository were forwarded, ordinary contributor
              # activity could keep evicting a queued report.
              if [ "$PR_DRAFT" = "true" ]; then
                echo "draft pull request; nothing to do"; echo "prs=" >> "$GITHUB_OUTPUT"; exit 0
              fi
              case "$PR_HEAD_REF" in
                progress/*) ;;
                *) echo "head branch $PR_HEAD_REF is not a progress branch"
                   echo "prs=" >> "$GITHUB_OUTPUT"; exit 0 ;;
              esac
              echo "prs=$PR_NUMBER" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch)
              echo "prs=$DISPATCHED" >> "$GITHUB_OUTPUT" ;;
            schedule)
              # Every open, non-draft progress report, oldest first. `--paginate` applies the filter
              # to each page of the listing separately, so the filter prints one report per line and
              # the lines of all pages are sorted together here.
              reports=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
                --jq '.[] | select(.draft | not) | select(.head.ref | startswith("progress/")) | "\(.number) \(.head.sha)"' \
                | sort -n)
              # A report the gate refused stays open for a human, and the gate comments on every
              # refusal. So a refused report is not offered again while its head is one that was
              # refused less than a day ago. After a day it is offered once more: some refusals
              # lapse with time or with `main` (the cadence, a roadmap that has since merged). A
              # report that was only held for the queue has no refusal on its head and is always
              # offered.
              #
              # Which head was refused is read from the last line of the refusal, which the gate
              # writes itself. Only the last line is trusted: the refusal quotes text from the pull
              # request, but always ends with the gate's closing sentence, so nothing quoted can
              # stand last. If the latest refusal has no such line (it was written by a gate pinned
              # before that line existed), dates decide: the report waits if its head was committed
              # before that refusal. That date is the author's to choose; a false one can only earn
              # the author's own report more or fewer retries.
              now=$(date -u +%s); keep=""
              while read -r number sha; do
                [ -n "$number" ] || continue
                # Every refusal under a day old: when it was written and the head noted on it, `-`
                # for none.
                refusals=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments?per_page=100" \
                  --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("The automated progress gate did not merge this pull request.")) | "\(.created_at) \([.body | capture("\n<!-- progress-gate-refused-head: (?<head>[0-9a-f]{40}) -->\\s*$").head][0] // "-")"' \
                  | sort | while read -r at noted; do
                      if [ $(( now - $(date -u -d "$at" +%s) )) -lt 86400 ]; then echo "$at $noted"; fi
                    done) || refusals=""
                # Any of them on the present head holds the report, not only the latest: runs
                # overlap, and a late refusal of an earlier head can follow the refusal of this one.
                refused=$(awk -v sha="$sha" '$2 == sha { at = $1 } END { print at }' <<< "$refusals")
                if [ -n "$refused" ]; then
                  echo "#$number was refused at $refused on its present head; not offered again yet"
                  continue
                fi
                # Otherwise the latest decides, and only if no head is noted on it.
                latest=$(tail -n 1 <<< "$refusals"); refused=${latest%% *}
                if [ -n "$refused" ] && [ "${latest#* }" = "-" ]; then
                  changed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq .commit.committer.date) || changed=""
                  if [ -n "$changed" ] && [ "$(date -u -d "$changed" +%s)" -le "$(date -u -d "$refused" +%s)" ]; then
                    echo "#$number was refused at $refused (head not noted) and its head was committed before that; not offered again yet"
                    continue
                  fi
                fi
                keep="$keep $number"
              done <<< "$reports"
              echo "prs=${keep# }" >> "$GITHUB_OUTPUT" ;;
          esac
      # A progress report landing on `main` resets every merge-queue group, and a group needs about
      # twenty minutes of quiet `main` to finish its build. Reports arriving every ten or fifteen
      # minutes starved the queue for hours (2026-11-09: #451 passed its group build four times and
      # was reset each time). While the queue holds entries, reports wait for the next scheduled run;
      # a queue whose oldest entry is over two hours old is stuck for other reasons and does not hold
      # them back. A dispatch by hand always proceeds, unless it asks to wait as an automatic run does.
      #
      # This check keeps a busy queue from costing a runner per waiting report. It is not the one
      # that protects the queue: each report is checked again before its validation, by the same
      # test in progress-merge-report.yml, and finally by the gate inside its landing step
      # (`hold_while_queue_busy`). Keep the three in step.
      - name: Hold while the merge queue is busy
        id: hold
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && !inputs.wait_for_queue }}
          PICKED: ${{ steps.pick.outputs.prs }}
        run: |
          set -euo pipefail
          # A JSON list of the numbers picked; `[]` when there are none.
          list=$(jq -nc --arg picked "$PICKED" '[$picked | splits("[ \n]+") | select(test("^[0-9]+$")) | tonumber]')
          if [ "$list" = "[]" ] || [ "$FORCE" = "true" ]; then echo "prs=$list" >> "$GITHUB_OUTPUT"; exit 0; fi
          q=$(gh api graphql -f query='query($o:String!,$n:String!){ repository(owner:$o,name:$n){ mergeQueue(branch:"main"){ entries(first:1){ totalCount nodes{ enqueuedAt } } } } }' \
               -f o="${GITHUB_REPOSITORY%/*}" -f n="${GITHUB_REPOSITORY#*/}" --jq '.data.repository.mergeQueue.entries | "\(.totalCount) \(.nodes[0].enqueuedAt // "")"')
          total=${q%% *}; oldest=${q#* }
          if [ "$total" != 0 ] && [ -n "$oldest" ] && [ $(( $(date -u +%s) - $(date -u -d "$oldest" +%s) )) -lt 7200 ]; then
            echo "::notice::merge queue holds $total entr(y/ies) (oldest enqueued $oldest); progress reports $list wait for the next scheduled run"
            echo "prs=[]" >> "$GITHUB_OUTPUT"
          else
            echo "prs=$list" >> "$GITHUB_OUTPUT"
          fi

  gate:
    needs: resolve
    if: needs.resolve.outputs.prs != '[]'
    # One report at a time, each with its own look at the merge queue: a queue that fills while an
    # earlier report is being validated holds the later ones. This orders the reports of one run.
    # A report's own pull request event starts a run of its own, which can reach the gate at the
    # same moment; the gate's look at the queue inside its landing step covers that.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.resolve.outputs.prs) }}
    # `write` here and nowhere else: the called workflow narrows it again to the job that explains
    # a refusal on the pull request, and a called workflow cannot exceed what this grants.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/progress-merge-report.yml
    with:
      pr: ${{ matrix.pr }}
      # A dispatch by hand lands its report whatever the queue holds, unless it asked to wait.
      force: ${{ github.event_name == 'workflow_dispatch' && !inputs.wait_for_queue }}
      # There is deliberately no author allowlist. Anyone may publish a progress report, including
      # from a fork: what bounds this is the shape of the diff (two generated files, one roadmap,
      # append-only log, window ending in published history), not who sent it. See
      # roadmap-workflows/README.md in TauCetiProgress.
      # `tau-ceti-roadmap-sync`, the App this repository's ruleset lists as a bypass actor. It must be
      # this one and not `secrets.APP_ID` (the review bot, which auto-merge.yml uses): the review bot
      # bypasses TauCeti's ruleset, not this one, so a direct merge with its token would be refused
      # for want of a code-owner review. auto-merge.yml can use it because it only *enables* GitHub's
      # native auto-merge and lets the ruleset gate the merge; this workflow merges directly.
      app_id: ${{ vars.SYNC_BOT_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.SYNC_BOT_APP_PRIVATE_KEY }}
