name: progress-merge

# Auto-merge generated progress reports (STATUS.md / PROGRESS.md) in this repository.
#
# All the validation, and the merge itself, live in a SHA-pinned reusable workflow in
# TauCetiProgress -- the same discipline TauCeti uses for TauCetiReview, and for the same reason: an
# unpinned `@main` would let an upstream change alter what is allowed to merge here without review.
# The pin must be bumped deliberately, in step with the `progress_ref` input and with the version the
# worker runs (see TauCetiProgress' README).
#
# `pull_request_target` rather than `pull_request` so the App secrets are available for the events we
# care about. That is safe here only because the called workflow never checks out or executes pull
# request content: it reads the PR through the API and merges. Note that `opened` fires for drafts
# too, hence the explicit draft guard below as well as inside the called workflow.
#
# Anyone may open a pull request against this repository. A pull request that fails any check is
# simply left alone for a human to review, which is the normal path for roadmap contributions.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  # A progress pull request usually opens before its `build` check finishes, so the gate has to be
  # re-run when CI reports. This listens for the CI WORKFLOW rather than for `check_suite`: GitHub
  # deliberately suppresses `check_suite` and `check_run` events for suites created by GitHub Actions
  # (it would otherwise recurse), and `build` is a job in this repository's own Actions `CI`
  # workflow. A `check_suite` trigger therefore never fires for it, and every report would sit
  # unmerged after the first pass saw `build` still pending.
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to consider.
        required: true
        type: number

# The floor. `resolve` needs no more than this; the `gate` job raises its own, because a called
# workflow can never exceed what the caller grants.
permissions:
  contents: read
  pull-requests: read


jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pick.outputs.pr }}
    steps:
      - name: Decide which pull request to consider
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          # Quoted through env rather than interpolated into the script: everything from the event
          # payload is attacker-influenced, and this job holds a token.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # The repository owner and branch CI built, for finding a fork's pull request (below).
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          # Through env, never interpolated into the script: attacker-controlled.
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request_target)
              # Cheap prefilter, so that only a plausible report ever reaches the gate. The gate
              # re-checks all of this and is the authority; the point here is queueing. The called
              # workflow serialises on a single group, which permits one running and one pending run,
              # so if every pull request in the repository were forwarded, ordinary contributor
              # activity could keep evicting a queued report.
              if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
                echo "draft pull request; nothing to do"; echo "pr=" >> "$GITHUB_OUTPUT"; exit 0
              fi
              case "$PR_HEAD_REF" in
                progress/*) ;;
                *) echo "head branch $PR_HEAD_REF is not a progress branch"
                   echo "pr=" >> "$GITHUB_OUTPUT"; exit 0 ;;
              esac
              # Only once `build` has finished on this head. A report is opened or pushed to before
              # CI has run, so the gate could only refuse it, and its refusal comment says the pull
              # request "is left for a human to review" -- on every report, although nothing is
              # wrong and nobody is needed: the workflow_run pass below takes it up when CI
              # completes. What still goes to the gate from here is a head whose build has already
              # finished, as when a report is reopened or marked ready.
              build="$(gh api "repos/$REPO/commits/$PR_HEAD_SHA/check-runs?check_name=build&per_page=100" \
                       --jq '[.check_runs[].status] | if length == 0 then "not started"
                             elif all(. == "completed") then "completed" else "running" end')"
              if [ "$build" != "completed" ]; then
                echo "build is $build on $PR_HEAD_SHA; the gate runs when CI completes"
                echo "pr=" >> "$GITHUB_OUTPUT"; exit 0
              fi
              echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch)
              echo "pr=${{ inputs.pr }}" >> "$GITHUB_OUTPUT" ;;
            workflow_run)
              # The open progress pull request for this head, if any.
              #
              # Asked of the commit directly, not of a list of recent pull requests. `gh pr list`
              # returns only the newest 30 by default, so anyone could open 30 newer pull requests and
              # push the legitimate report out of the window -- its build would complete and this
              # trigger would never find it.
              #
              # Fork heads are included. Anyone may publish a report, and an operator without push
              # access here publishes from their own fork, so excluding them would mean their build
              # completing and this trigger never finding the pull request. The commit alone cannot
              # find them, though: `commits/<sha>/pulls` answers from this repository's view of the
              # commit, and a commit that exists only in a fork has no pull requests here, so it
              # returns `[]` for every fork report. (ldct's reports #464 and #491-#524 were each gated
              # once, while their `build` was still running, and never again.) The run names the
              # repository and branch it built, so a fork's pull request is also looked up by that
              # head. The lookup needs nothing the event payload could abuse: the owner and the
              # branch must have the shapes of a login and a progress branch, or it is skipped.
              #
              # Every condition the gate itself would refuse on is filtered FIRST, and only then is
              # one chosen. That starts with the head SHA, for both lookups: the commit lookup also
              # returns a pull request whose branch contains this commit but has moved past it, and
              # the head lookup a branch that moved after CI built it. Chosen, such a pull request is
              # gated on a head whose build may still be running and refused, and the report this run
              # built is never queued. Sharing a head SHA means sharing a tree, but not a base branch,
              # a draft flag, or a branch name: an older pull request at the same commit, retargeted
              # or renamed, would otherwise be selected, refused forever, and the legitimate report
              # never reconsidered once CI completed.
              #
              # `min` among what survives, so repeated runs agree with each other.
              #
              # `--slurp` so the pages arrive as ONE array; the filter then runs over all of them.
              # Without it `--jq` is applied page by page: page one emits an empty line, and a
              # legitimate match on a later page is lost -- the same starvation the 30-item default
              # allowed, just moved. `--slurp` cannot be combined with `--jq`, hence `jq` afterwards.
              #
              # The responses reach `jq` on its standard input, never as arguments. They carry every
              # candidate's body, and Linux caps a single argument at 128 KiB, so with `--argjson` a
              # few long bodies stopped `jq` from starting at all and the report was never gated.
              # `printf` is a bash builtin, so nothing is exec'd with them on its command line.
              by_commit="$(gh api --paginate --slurp "repos/$REPO/commits/$HEAD_SHA/pulls")"
              by_head='[]'
              if [[ "$HEAD_OWNER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]] \
                 && [[ "$HEAD_BRANCH" =~ ^progress/[0-9a-f]{7}-[0-9a-f]{7}/[A-Za-z0-9]+$ ]]; then
                by_head="$(gh api --paginate --slurp \
                           "repos/$REPO/pulls?state=open&per_page=100&head=$HEAD_OWNER:$HEAD_BRANCH")"
              fi
              pr="$(printf '%s\n' "$by_commit" "$by_head" \
                    | jq -rs --arg repo "$REPO" --arg sha "$HEAD_SHA" '
                         .[0] as $by_commit | .[1] as $by_head
                         | [(($by_commit[][]), ($by_head[][]))
                          | select(.head.sha == $sha)
                          | select(.state == "open")
                          | select(.draft | not)
                          | select(.base.ref == "main")
                          | select(.base.repo.full_name == $repo)
                          | select(.head.ref | test("^progress/[0-9a-f]{7}-[0-9a-f]{7}/[A-Za-z0-9]+$"))
                          | .number] | min // ""')"
              echo "pr=$pr" >> "$GITHUB_OUTPUT" ;;
          esac

  gate:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    # Pinned to a full TauCetiProgress SHA. `progress_ref` must be the SAME SHA: it selects the
    # validator code checked out inside, and a mismatch would validate with different rules than the
    # ones reviewed here.
    # `write` here and nowhere else: the called workflow narrows it again to the one job that
    # explains a refusal on the pull request, and a called workflow cannot exceed what this grants.
    permissions:
      contents: read
      pull-requests: write
    uses: TauCetiProject/TauCetiProgress/.github/workflows/merge.yml@b7d96c7a41cbfe11c1380cb7de70fff48298e9dc
    with:
      pr: ${{ fromJSON(needs.resolve.outputs.pr) }}
      progress_ref: b7d96c7a41cbfe11c1380cb7de70fff48298e9dc
      # There is deliberately no author allowlist. Anyone may publish a progress report, including
      # from a fork: what bounds this is the shape of the diff (two generated files, one roadmap,
      # append-only log, window ending in published history), not who sent it. See
      # roadmap-workflows/README.md in TauCetiProgress.
      # `tau-ceti-roadmap-sync`, the App this repository's ruleset lists as a bypass actor. It must be
      # this one and not `secrets.APP_ID` (the review bot, which auto-merge.yml uses): the review bot
      # bypasses TauCeti's ruleset, not this one, so a direct merge with its token would be refused
      # for want of a code-owner review. auto-merge.yml can use it because it only *enables* GitHub's
      # native auto-merge and lets the ruleset gate the merge; this workflow merges directly.
      app_id: ${{ vars.SYNC_BOT_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.SYNC_BOT_APP_PRIVATE_KEY }}
