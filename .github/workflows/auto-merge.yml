name: auto-merge

# Queue every non-draft PR targeting protected `main` for GitHub-native auto-merge, using a
# tauceti-review-bot App token (the org disables write GITHUB_TOKEN). The `main` ruleset requires a
# roadmap-reviewers code-owner approval, the `build` check, and a merge queue, so GitHub adds the
# PR to the queue once a team member approves, and the queue builds it against `main` plus the
# entries ahead of it before merging. PRs targeting feature branches must not
# reach `gh pr merge --auto`: those branches have no merge requirements, so the command would merge
# immediately instead of queueing. Native auto-merge watches PR state directly, so this is
# unaffected by the pull_request_review event-delivery issue.

# Use pull_request_target (not pull_request) so the tauceti-review-bot App secrets are available
# for PRs opened from forks — the common case for external contributors. This job never checks out
# or runs PR code (it only calls `gh pr merge`), so pull_request_target is safe here.
on:
  pull_request_target:
    # `edited` reconsiders a stacked PR when its base is changed to `main`. The job condition below
    # ignores title/body edits. GitHub disables existing auto-merge when a PR's base changes.
    #
    # `synchronize` re-arms auto-merge after a push. GitHub also drops auto-merge when a pull
    # request becomes conflicted with `main`, silently and with no event of its own, and resolving
    # that conflict is a push rather than a reopen. Without this trigger a pull request loses
    # auto-merge the first time it ever conflicts and never regains it, so the longest-open ones
    # accumulate approvals and sit unmerged. `gh pr merge --auto` is idempotent, so re-running it
    # on every push costs nothing.
    types: [opened, reopened, ready_for_review, edited, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  enable:
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token (pull-requests + contents write)
        id: token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject
          repositories: TauCetiRoadmap
          permission-pull-requests: write
          permission-contents: write
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PROTECTED_BASE: main
        run: |
          set -euo pipefail

          # Re-read the live PR because a queued or re-run job may outlive its event payload.
          current_base=$(gh pr view "$PR" --repo "$REPO" --json baseRefName --jq .baseRefName)
          if [ "$current_base" != "$PROTECTED_BASE" ]; then
            echo "::notice::PR #$PR now targets $current_base; auto-merge is only enabled for $PROTECTED_BASE"
            exit 0
          fi

          # Fail closed if the repository rules drift away from the assumptions that make
          # auto-merge safe. Merely naming `main` is not enough: `--auto` merges immediately when
          # there are no unmet requirements.
          # The merge_queue rule is asserted alongside the other two because it is what makes the
          # gating `build` a statement about the merge result rather than about whatever `main`
          # looked like when the branch was last pushed. Without it a months-old green check still
          # satisfies the gate, which is how a stale import reached `main` and broke it for three
          # days. Dropping the rule must break this job, not quietly weaken the gate.
          rules=$(gh api "repos/$REPO/rules/branches/$PROTECTED_BASE")
          if ! jq -e '
              any(.[]; .type == "pull_request"
                and .parameters.required_approving_review_count >= 1
                and .parameters.require_code_owner_review == true)
              and
              any(.[]; .type == "required_status_checks"
                and any(.parameters.required_status_checks[]?; .context == "build"))
              and
              any(.[]; .type == "merge_queue"
                and .parameters.merge_method == "SQUASH")
            ' <<<"$rules" >/dev/null; then
            echo "::error::$PROTECTED_BASE lacks the required code-owner review, the build check, or a squash merge queue"
            exit 1
          fi

          # The queue owns the merge method once it is enabled, and `gh` warns that a supplied
          # strategy is overridden by the queue before taking the queue path. `--squash` is kept
          # because it is still required in the window before the rule exists, where `--auto` with
          # no strategy fails non-interactively. The rule check above asserts the queue is squash
          # too, so the flag and the queue cannot silently disagree.
          gh pr merge "$PR" --repo "$REPO" --auto --squash
