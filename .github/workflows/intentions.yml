name: Intentions

on:
  issue_comment:
    types: [created]
  issues:
    # `labeled` catches the intention issues that label-intentions.yml labels after the fact:
    # they open without `intention`, so the `opened` event fails the auto-add filter below.
    types: [opened, labeled, closed, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  schedule:
    # Every 30 minutes, so short (hour-scale) TTLs are released reasonably promptly.
    # GitHub cron is loose, so release lags somewhat.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  intentions:
    permissions:
      issues: write
      pull-requests: write
    # Run the released action directly so this small job shares the protected
    # control slot with labels and progress reports.
    if: >-
      github.event_name != 'issue_comment'
      || github.event.comment.performed_via_github_app.id != fromJSON(vars.CLAIM_BOT_APP_ID)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'issue_comment' && format('intentions-issue-{0}', github.event.issue.number) || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'intentions-sweep' || format('intentions-item-{0}', github.event.issue.number || github.event.pull_request.number) }}
      cancel-in-progress: false
    steps:
      - name: Mint project token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CLAIM_BOT_APP_ID }}
          private-key: ${{ secrets.CLAIM_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: leanprover-community/intentions@d302e11f5cf065a8a81de5a4d4c05eb9b7b70f70 # v1
        with:
          mode: ${{ github.event_name == 'issue_comment' && 'command' || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'sweep' || 'lifecycle' }}
          project-token: ${{ steps.token.outputs.token }}
          repo-token: ${{ github.token }}
          project-title: "Tau Ceti"
          default-ttl: "30d"
          max-ttl: "90d"
          auto-add-labels: "intention"
