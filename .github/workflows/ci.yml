name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Required so `build` reports inside a merge queue. Without it the queue's `gh-readonly-queue/...`
  # ref runs no CI at all, `build` never arrives, and every queued pull request waits until it times
  # out -- which is why this had to land before the queue was turned on, and why removing it now
  # would wedge the queue rather than merely skip a check.
  #
  # The queue is what stops a stale branch reddening `main`. `pull_request` tests a merge of the
  # branch with `main` as it was when CI last ran, and the `main` ruleset does not require a branch
  # to be up to date (`strict_required_status_checks_policy` is off, which is correct once a queue
  # exists and would otherwise force a rebase before every merge). A pull request can therefore be
  # green against a month-old base and still break `main` on merge. That is exactly how `main` broke
  # on 2026-09-14: #350 archived `TauCetiRoadmap/IntegralLattices/Suggested.lean` to `Completed/` on
  # the 10th, #218 -- opened on 2026-08-13 and never retested -- merged on the 14th still importing
  # the old path, and each was green alone. The queue tests the result of merging, in order, so the
  # combination is what has to pass.
  merge_group:

permissions:
  contents: read

# One live build per pull request. A push makes the previous head's build irrelevant, since the
# required check is per commit, but without this it still waits for, and then occupies, one of the
# org's 20 GitHub-hosted runner slots. On 2026-11-07 the wait for a slot passed 18 hours, longer
# than the merge queue's 6-hour check timeout (the most GitHub allows), so every queue entry timed
# out before its build started, the queue rebuilt behind it, and nothing merged for 33 hours.
#
# Only `pull_request` runs share a group. A `merge_group` ref is already unique to its candidate,
# and a `push` to `main` keeps a build of its own as before; `run_id` gives each of those a group
# nothing else joins.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Merge candidates have one protected fleet slot. PR builds use shared
    # Namespace capacity and cannot occupy the merge queue's runner.
    runs-on: ${{ github.event_name == 'merge_group' && fromJSON('{"group":"TauCetiRoadmap","labels":"tauceti-fleet-roadmap"}') || fromJSON('["nscloud-ubuntu-24.04-amd64-8x16-with-features"]') }}
    steps:
      # A merge-queue candidate that `main` has moved out from under can never merge, and GitHub does
      # not cancel its build. Whenever something lands on `main` outside the queue (a progress report,
      # an admin merge), the queue rebuilds every candidate and leaves the old builds queued; on
      # 2026-11-07 each such build still took a runner for 12 to 20 minutes. This stops one before
      # anything else runs.
      #
      # It needs two signs, and waits for the second, so that it cannot stop a build the queue still
      # depends on: the candidate no longer contains `main` (the compare reads `diverged`), and the
      # queue has deleted the candidate's ref. A stopped build fails rather than passes, so that a
      # mistake here can at worst drop an entry from the queue, never let one merge unbuilt. An API
      # error falls through to the full build.
      - name: Stop if this merge-queue candidate has been superseded
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -uo pipefail
          base="${BASE_REF#refs/heads/}"
          status="$(gh api "repos/$REPO/compare/$base...$HEAD_SHA" --jq .status 2>/dev/null)" || status=""
          if [ "$status" != diverged ]; then
            echo "compare $base...${HEAD_SHA:0:7}: ${status:-unavailable}; building"
            exit 0
          fi
          for _ in 1 2 3 4 5 6; do
            rc=0
            git ls-remote --exit-code "https://github.com/$REPO" "$HEAD_REF" > /dev/null 2>&1 || rc=$?
            if [ "$rc" = 2 ]; then
              echo "::error title=superseded merge group::$base has moved past ${HEAD_SHA:0:7} and the queue has dropped $HEAD_REF, so there is nothing to build"
              exit 1
            fi
            [ "$rc" = 0 ] || break
            sleep 30
          done
          echo "::notice::$base has moved past ${HEAD_SHA:0:7}, but $HEAD_REF is still there; building"

      # Depth 2 so that a pull request's merge commit has its base parent, for the scope step below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # A pull request that changes only progress reports (`STATUS.md` and `PROGRESS.md` in a roadmap
      # directory, active or `Completed/`) changes nothing `lake build` reads, so its build stops
      # after the topic check. The progress gate validates those files itself, and building them
      # cost a runner 12 to 150 minutes for nothing. Only `pull_request` is narrowed: a merge-queue
      # candidate and `main` are always built in full, so whatever reaches `main` through the queue
      # has been built.
      #
      # The checkout is GitHub's merge of the pull request into its base, whose first parent is the
      # base, so this diff is exactly what the pull request changes. `--no-renames` lists both sides
      # of a rename, so a Lean file moved onto a report's path still counts. Anything unexpected,
      # including no diff at all, builds in full.
      #
      # The Lean steps below test `github.event_name` before this step's output, and the output is
      # a word, not a number. The first version of this step wrote `0`/`1` and the steps tested
      # `steps.scope.outputs.lean != '0'`. On every other event this step is skipped, its output is
      # null, and GitHub's loose comparison turns both null and '0' into the number 0, so the test
      # failed and every merge-queue candidate and push to `main` skipped the build. From 2026-11-08
      # 02:11 to the fix, the queue merged #1051 and #1653 unbuilt and broke `main`, while `main`'s
      # own CI stayed green.
      - name: Decide whether the Lean build is needed
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -uo pipefail
          if ! files="$(git diff --name-only --no-renames HEAD^1 HEAD)" || [ -z "$files" ]; then
            echo "lean=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qvE '^(TauCetiRoadmap|Completed)/[^/]+/(STATUS|PROGRESS)\.md$' <<< "$files"; then
            echo "lean=build" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Only progress reports changed; skipping the Lean build"
            printf '%s\n' "$files"
            echo "lean=skip" >> "$GITHUB_OUTPUT"
          fi

      # Every roadmap names its arXiv topic in a `metadata.toml` (README.md, "Filing a roadmap").
      # This is a step of `build` rather than a job of its own because `build` is the check the
      # `main` ruleset requires, so this is what makes the topic a merge requirement. It runs before
      # the Lean setup so that a missing topic fails in seconds rather than after the Mathlib restore.
      - name: Test the roadmap topic checker
        run: python3 .github/scripts/test_check_roadmap_topics.py

      - name: Check roadmap topics
        run: python3 .github/scripts/check_roadmap_topics.py

      # Install Lean and materialize the dependency workspace. This restores Mathlib through its
      # own cache (`lake exe cache get`) but deliberately leaves the project build to the final step.
      - name: Set up Lean and restore Mathlib
        if: github.event_name != 'pull_request' || steps.scope.outputs.lean != 'skip'
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false

      # Fetch Tau Ceti's cache map from its public Lake service. Artifacts stay lazy: the build
      # downloads only the Tau Ceti modules it actually imports. This is distinct from Mathlib's
      # cache above, and avoids making every package in the workspace cache-writable.
      #
      # The defaults after `||` are for pull requests from forks, where the `vars` values arrive
      # empty. Without them a fork's build compiled all of Tau Ceti (some 5,700 modules, 90 to 150
      # minutes) where a branch in this repository took 12 to 20 with the cache, and since most
      # roadmap pull requests come from forks that was most of the CI backlog. They are the same
      # public, read-only endpoints the variables hold, so a fork reading them gains nothing anyone
      # else lacks.
      - name: Fetch Tau Ceti cache map
        id: tauceti_cache
        if: github.event_name != 'pull_request' || steps.scope.outputs.lean != 'skip'
        shell: bash
        env:
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC || 'https://cache.taucetiproject.org/artifacts' }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC || 'https://cache.taucetiproject.org/revisions' }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLIC_ARTIFACT_ENDPOINT" ] || [ -z "$PUBLIC_REVISION_ENDPOINT" ]; then
            echo "::warning::Tau Ceti artifact cache endpoints are not configured; building from source"
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          config="$RUNNER_TEMP/tauceti-lake-cache.toml"
          cache_dir="$GITHUB_WORKSPACE/.lake/cache"
          cat > "$config" <<TOML
          cache.defaultService = "tauceti-public"
          [[cache.service]]
          name = "tauceti-public"
          kind = "s3"
          artifactEndpoint = "$PUBLIC_ARTIFACT_ENDPOINT"
          revisionEndpoint = "$PUBLIC_REVISION_ENDPOINT"
          TOML

          discard_cache() {
            [ -e "$cache_dir" ] || return 0
            stale="$cache_dir.discard.$$"
            if mv "$cache_dir" "$stale" 2>/dev/null; then
              rm -rf "$stale" 2>/dev/null || true
            else
              rm -rf "$cache_dir" 2>/dev/null || true
            fi
          }

          clean=0
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            discard_cache
            log="$RUNNER_TEMP/tauceti-cache-get-$attempt.log"
            rc=0
            LAKE_CONFIG="$config" LAKE_CACHE_DIR="$cache_dir" \
                lake cache get --package=TauCeti --service=tauceti-public \
                  --repo=TauCetiProject/TauCeti --mappings-only --max-revs=20 \
                  > "$log" 2>&1 || rc=$?
            cat "$log"

            if [ "$rc" = 0 ]; then
              clean=1
              break
            fi
            if grep -q 'no outputs found' "$log"; then
              break
            fi
            if [ "$attempt" != "$attempts" ]; then
              echo "::notice::Tau Ceti cache-map fetch attempt $attempt failed; retrying from an empty cache"
              sleep 2
            fi
          done

          if [ "$clean" = 1 ]; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
            {
              echo "LAKE_CONFIG=$config"
              echo "LAKE_CACHE_DIR=$cache_dir"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Tau Ceti cache map unavailable; building from source"
            discard_cache
            echo "enabled=0" >> "$GITHUB_OUTPUT"
          fi

      # Build only. The roadmap's Lean targets carry `sorry` on purpose (they are goals),
      # so there is no axiom audit or warning-as-error here.
      - name: Build
        if: github.event_name != 'pull_request' || steps.scope.outputs.lean != 'skip'
        run: lake build

      # Keep degradation visible without turning a cache-service outage into a correctness failure.
      - name: Report Tau Ceti cache use
        if: ${{ always() && steps.tauceti_cache.outputs.enabled == '1' }}
        shell: bash
        run: |
          count=0
          if [ -d "$LAKE_CACHE_DIR/artifacts" ]; then
            count=$(find "$LAKE_CACHE_DIR/artifacts" -type f | wc -l)
          fi
          if [ "$count" -eq 0 ]; then
            echo "::warning::Tau Ceti cache map was found, but the build restored no artifacts"
          else
            echo "::notice::The build restored $count Tau Ceti artifact archive(s)"
          fi
